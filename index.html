<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キク栽培・電照管理アプリ</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#19372c;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px}h1{font-size:1.45rem;margin-bottom:6px}h2{font-size:1.15rem;margin:0 0 12px}p{line-height:1.55}section{background:#fff;border-radius:15px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #142d2110}label{display:block;font-weight:650;margin:13px 0 5px}input,select{width:100%;padding:11px;border:1px solid #aebdb4;border-radius:9px;font-size:16px;background:#fff;color:#18332a}small,.muted{color:#5b6e63;font-size:.86rem}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #e5ede7;flex-wrap:wrap}.result strong{font-size:.98rem}.tag{border-radius:7px;padding:4px 7px;background:#e2effb}.dark{background:#ece5fa}.warning{color:#a44217;font-weight:650}button,.filelabel{display:inline-block;background:#176a4b;color:white;border:0;border-radius:9px;padding:11px 14px;font-size:15px;font-weight:600;margin:5px 5px 5px 0;cursor:pointer;text-align:center}.secondary{background:#e7f1eb;color:#16583e}.danger{background:#fff1ed;color:#9c3928}.saved{border:1px solid #e1eae4;border-radius:10px;padding:12px;margin:10px 0}.saved h3{font-size:1rem;margin:0 0 5px;overflow-wrap:anywhere}.saved p{margin:5px 0;font-size:.9rem}.toolbar{display:flex;flex-wrap:wrap;align-items:center}.filelabel input{display:none}footer{font-size:.8rem;color:#5c6c61;padding-bottom:25px}@media(max-width:430px){.two{grid-template-columns:1fr}.result{display:block}.result strong{display:block;margin-top:6px}}@media print{.no-print{display:none}body{background:white}section{box-shadow:none;border:1px solid #ddd}}
</style></head><body><main><h1>🌼 キク栽培・電照管理アプリ</h1><p class="muted">農家さん個別利用｜収穫予定日から各作業日を逆算・保存</p><section><h2>栽培情報</h2><label for="farmer">農家名</label><input id="farmer" placeholder="例：山田 太郎"><div class="two"><div><label for="item">品目</label><select id="item"><option>大菊</option><option>小菊</option><option>スプレー菊</option></select></div><div><label for="variety">品種名</label><input id="variety" placeholder="例：品種A"></div></div><label for="harvest">収穫予定日</label><input id="harvest" type="date" value="2027-03-01"><label for="total">定植から収穫まで（日）</label><input id="total" type="number" min="1" step="1" value="120"><label for="dark1">第一消灯（日数）</label><input id="dark1" type="number" min="0" step="1" value="20"><label for="light2">再電（日数）</label><input id="light2" type="number" min="0" step="1" value="20"><label for="flower">到花日数（日数）</label><input id="flower" type="number" min="0" step="1" value="60"><small>第一消灯＝第一消灯から再電までの暗期日数、再電＝再電から最終消灯までの明期日数です。定植から第一消灯までの明期日数は自動計算します。</small></section><section><h2>逆算結果</h2><div id="output" aria-live="polite"></div><p id="notice" class="warning"></p><div class="toolbar no-print"><button id="save">この栽培予定を保存</button><button id="copy" class="secondary">結果をコピー</button><button id="print" class="secondary">印刷</button></div><p id="saveNotice" class="muted" role="status"></p></section><section class="no-print"><h2>保存した栽培予定 <span id="count"></span></h2><input id="search" placeholder="農家名・品目・品種名で検索" aria-label="保存データ検索"><div id="savedList"></div><div class="toolbar"><button id="export" class="secondary">バックアップを書き出す</button><label class="filelabel secondary">バックアップを読み込む<input id="import" type="file" accept="application/json,.json"></label></div><small>保存先は、このブラウザ・端末内です。別のスマホやJA職員と自動共有されません。端末変更・ブラウザデータ削除に備え、バックアップを書き出してください。</small></section><footer>※各日数は切替日間の経過日数です。日付は暦日で計算します。実際の開花・収穫時期は品種・気象・栽培条件によって変わります。</footer></main><script>
(()=>{'use strict';const KEY='kiku-plans-v4';const ids=['farmer','item','variety','harvest','total','dark1','light2','flower'];const el=id=>document.getElementById(id);let editing=null,computed='',valid=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function get(){return Object.fromEntries(ids.map(id=>[id,el(id).value]))}function date(s){if(!/^\d{4}-\d\d-\d\d$/.test(s))return null;let d=new Date(s+'T12:00:00Z');return Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==s?null:d}function add(d,n){return new Date(d.getTime()+n*86400000)}function jp(d){return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日`}function calc(){let x=get(),h=date(x.harvest),nums=['total','dark1','light2','flower'].map(k=>x[k]===''?NaN:Number(x[k]));valid=false;computed='';if(!h||nums.some(n=>!Number.isSafeInteger(n)||n<0)||nums[0]<=0){el('output').textContent='正しい収穫予定日と日数を入力してください。';el('notice').textContent='';return}let [total,d1,l2,f]=nums,first=total-d1-l2-f;if(first<0){el('output').textContent='';el('notice').textContent=`各期間の合計が栽培日数を${-first}日超えています。`;return}let H=h,off2=add(H,-f),on2=add(off2,-l2),off1=add(on2,-d1),st=add(H,-total);let rows=[['定植日（明期開始）',st],['第一消灯日（暗期開始）',off1],['再電日（明期開始）',on2],['最終消灯日（暗期開始）',off2],['収穫予定日',H]];el('output').innerHTML=rows.map((r,i)=>`<div class="result"><span class="tag ${i===1||i===3?'dark':''}">${r[0]}</span><strong>${jp(r[1])}</strong></div>`).join('');el('notice').textContent=first===0?'初回明期が0日です。設定を確認してください。':'';computed=`農家名：${x.farmer}\n品目：${x.item}\n品種名：${x.variety}\n`+rows.map(r=>r[0]+'：'+jp(r[1])).join('\n')+`\n初回明期：${first}日`;valid=true}function read(){try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}function write(a){localStorage.setItem(KEY,JSON.stringify(a))}function save(){if(!valid){el('saveNotice').textContent='日付・日数を確認してください。';return}let x=get();if(!x.farmer.trim()||!x.variety.trim()){el('saveNotice').textContent='農家名と品種名を入力してください。';return}let a=read(),id=editing||String(Date.now())+'-'+Math.random().toString(36).slice(2,8),now=new Date().toISOString();let old=a.find(p=>p.id===id);let p={id,...x,updated:now,created:old?.created||now};if(old)a=a.map(v=>v.id===id?p:v);else a.unshift(p);try{write(a);editing=id;el('saveNotice').textContent='保存しました。';render()}catch{el('saveNotice').textContent='保存できませんでした。ブラウザの保存設定・空き容量を確認してください。'}}function render(){let q=el('search').value.trim().toLowerCase(),a=read().filter(p=>[p.farmer,p.item,p.variety].some(v=>String(v||'').toLowerCase().includes(q)));el('count').textContent=`（${read().length}件）`;let box=el('savedList');box.replaceChildren();if(!a.length){box.textContent='該当する保存データはありません。';return}for(let p of a){let div=document.createElement('div');div.className='saved';div.innerHTML=`<h3>${esc(p.farmer||'未入力')} ／ ${esc(p.item||'')} ／ ${esc(p.variety||'')}</h3><p>収穫予定：${esc(p.harvest||'')}　栽培日数：${esc(p.total||'')}日</p>`;let b=document.createElement('button');b.textContent='開く・編集';b.className='secondary';b.onclick=()=>{for(let k of ids)if(p[k]!=null)el(k).value=p[k];editing=p.id;calc();el('saveNotice').textContent='保存済みデータを読み込みました。変更後は「保存」を押してください。';window.scrollTo({top:0,behavior:'smooth'})};let d=document.createElement('button');d.textContent='削除';d.className='danger';d.onclick=()=>{if(confirm(`${p.farmer}／${p.variety} の栽培予定を削除しますか？`)){try{write(read().filter(v=>v.id!==p.id));if(editing===p.id)editing=null;render()}catch{alert('削除できませんでした')}}};div.append(b,d);box.append(div)}}ids.forEach(id=>el(id).addEventListener('input',()=>{calc();el('saveNotice').textContent=''}));el('save').onclick=save;el('search').oninput=render;el('print').onclick=()=>window.print();el('copy').onclick=async()=>{if(!valid)return;try{await navigator.clipboard.writeText(computed);alert('コピーしました')}catch{prompt('以下をコピーしてください',computed)}};el('export').onclick=()=>{let blob=new Blob([JSON.stringify({type:'kiku-plans',version:5,plans:read()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='キク栽培管理_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('import').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.type!=='kiku-plans'||!Array.isArray(data.plans)||data.plans.length>10000||!data.plans.every(p=>p&&typeof p.id==='string'&&ids.every(k=>typeof p[k]==='string')))throw Error('format');if(!confirm(`${data.plans.length}件を読み込みます。既存データと同じIDは上書きします。よろしいですか？`))return;let map=new Map(read().map(p=>[p.id,p]));for(let p of data.plans)map.set(p.id,p);write([...map.values()]);render();alert('読み込みました')}catch{alert('読み込めませんでした。正しいバックアップファイルか確認してください。')}finally{e.target.value=''}};calc();render()})();
</script></body></html>
